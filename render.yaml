services:
  - type: web
    name: wudapp-server
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/server
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @wudapp/server build
    startCommand: pnpm --filter @wudapp/server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./wudapp.db
      - key: UPLOADS_DIR
        value: ./uploads
      - key: MAX_IMAGE_BYTES
        value: 10485760
      - key: MAX_VIDEO_BYTES
        value: 104857600
      - key: MAX_VOICE_BYTES
        value: 26214400