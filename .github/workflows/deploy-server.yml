name: Deploy Server to Render

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/types/**'
      - 'render.yaml'

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -X POST \
            -H "Content-Type: application/json"